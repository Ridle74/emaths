<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easyMaths - Michel H'R</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green-dark: #6a8c1e; --text-dark: #2a2a2a;
  --text-mid: #444; --silver: #c0c0c0; --marble-bg: #f4f3f1;
}
body {
  background: var(--marble-bg);
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh; overflow-x: hidden; position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    linear-gradient(135deg, rgba(200,200,195,0.15) 0%, transparent 40%),
    linear-gradient(45deg, transparent 60%, rgba(210,207,200,0.12) 100%);
  pointer-events: none; z-index: 0;
}

/* BRANCHES: z-index 0, strictly behind everything, NO overflow hidden */
.branch {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  /* NO overflow:hidden so they never clip any other element */
}

/* TOP-RIGHT branch: small, tucked in top-right corner
   In reference: ~130px wide, clearly in corner, NOT near logo area */
.branch-tr {
  top: -8px;
  right: -8px;
  width: 140px;
  animation: swayR 7s ease-in-out infinite;
  transform-origin: top right;
}

/* BOTTOM-LEFT branch: same size, bottom-left corner */
.branch-bl {
  bottom: -8px;
  left: -8px;
  width: 140px;
  animation: swayL 8s ease-in-out infinite;
  transform-origin: bottom left;
}

.branch img {
  width: 100%;
  height: auto;
  display: block;
}
/* BL branch: rotate 180deg to mirror into bottom-left corner */
.branch-bl img { transform: rotate(180deg); }

@keyframes swayR {
  0%,100%{transform:rotate(0deg)} 40%{transform:rotate(1.5deg)} 70%{transform:rotate(-1deg)}
}
@keyframes swayL {
  0%,100%{transform:rotate(0deg)} 40%{transform:rotate(-1.5deg)} 70%{transform:rotate(1deg)}
}

/* PAGE CONTENT: z-index 1, always above branches */
.page {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 28px 70px;
}

/* LOGO — no overflow hidden anywhere near it */
.logo-section {
  margin-top: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeDown 1s ease both;
  /* padding ensures the floating animation has room */
  padding: 10px 0 4px;
}
.logo-img {
  width: 210px;
  height: auto;
  display: block;
  /* drop-shadow only, no clip */
  filter: drop-shadow(0 4px 16px rgba(100,140,30,0.18));
  animation: logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat {
  0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
}

/* NAME */
.name-section {
  margin-top: 24px;
  text-align: center;
  animation: fadeUp 1s 0.3s ease both;
}
.name-main {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px,9.5vw,54px);
  font-weight: 400; color: var(--text-dark);
  letter-spacing: -0.5px; line-height: 1.05;
}
.name-script {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(24px,6vw,34px); color: var(--green-dark);
  line-height: 1.2; margin-top: 4px;
  animation: scriptReveal 1.2s 0.6s ease both;
}
@keyframes scriptReveal {
  from{opacity:0;transform:translateX(-10px) skewX(-3deg)} to{opacity:1;transform:none}
}

/* DIVIDER */
.divider {
  width: 120px; margin: 20px 0 24px;
  display: flex; align-items: center; gap: 8px;
  animation: fadeUp 1s 0.5s ease both;
}
.divider-line { flex:1; height:0.5px; background:var(--silver); }
.divider-dot { width:5px; height:5px; border-radius:50%; background:#9dc43b; box-shadow:0 0 6px rgba(157,196,59,0.4); }

/* BUTTONS */
.buttons-grid { width:100%; display:flex; flex-direction:column; gap:14px; }
.btn-wrapper { position:relative; transition:transform 0.3s ease; }
.btn-wrapper:hover{transform:translateY(-2px)} .btn-wrapper:active{transform:scale(0.99)}
.btn-frame { position:absolute; inset:-5px; border-radius:3px; background:transparent; pointer-events:none; overflow:hidden; }
.btn-frame::before {
  content:''; position:absolute; inset:0;
  background-image:radial-gradient(circle,rgba(175,175,175,0.9) 1px,transparent 1px),radial-gradient(circle,rgba(195,195,195,0.6) 1px,transparent 1px);
  background-size:4px 4px,7px 7px; background-position:0 0,2px 2px;
  border-radius:inherit; animation:shimmer 3s linear infinite; opacity:0.7;
}
@keyframes shimmer{0%{background-position:0 0,2px 2px;opacity:0.5}50%{opacity:1}100%{background-position:4px 4px,6px 6px;opacity:0.5}}
.btn-main {
  display:flex; align-items:center; justify-content:center;
  width:100%; padding:17px 24px;
  background:rgba(255,255,255,0.82); border:1.5px solid rgba(200,200,200,0.6);
  border-radius:2px; cursor:pointer; position:relative; z-index:1;
  backdrop-filter:blur(4px); transition:background 0.3s,border-color 0.3s; overflow:hidden;
}
.btn-main::before {
  content:''; position:absolute; left:-100%; top:0; width:60%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(157,196,59,0.08),transparent);
  transition:left 0.5s ease;
}
.btn-wrapper:hover .btn-main::before{left:150%}
.btn-wrapper:hover .btn-main{background:rgba(255,255,255,0.95);border-color:rgba(157,196,59,0.35)}
.btn-text { font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; letter-spacing:3.5px; color:var(--text-dark); text-transform:uppercase; }
.btn-corner { position:absolute; width:10px; height:10px; border-color:var(--silver); border-style:solid; z-index:2; transition:border-color 0.3s; }
.btn-wrapper:hover .btn-corner{border-color:#9dc43b}
.btn-corner.tl{top:2px;left:2px;border-width:1.5px 0 0 1.5px}
.btn-corner.tr{top:2px;right:2px;border-width:1.5px 1.5px 0 0}
.btn-corner.bl{bottom:2px;left:2px;border-width:0 0 1.5px 1.5px}
.btn-corner.br{bottom:2px;right:2px;border-width:0 1.5px 1.5px 0}
.btn-wrapper:nth-child(1){animation:fadeUp 0.6s 0.65s ease both}
.btn-wrapper:nth-child(2){animation:fadeUp 0.6s 0.75s ease both}
.btn-wrapper:nth-child(3){animation:fadeUp 0.6s 0.85s ease both}
.btn-wrapper:nth-child(4){animation:fadeUp 0.6s 0.95s ease both}
.btn-wrapper:nth-child(5){animation:fadeUp 0.6s 1.05s ease both}

/* SOCIAL */
.social-row { margin-top:44px; display:flex; align-items:flex-end; justify-content:center; gap:32px; animation:fadeUp 1s 0.9s ease both; }
.social-item { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-decoration:none; transition:transform 0.3s; }
.social-item:hover{transform:translateY(-4px)}
.social-icon { width:52px; height:52px; border-radius:50%; background:var(--text-dark); display:flex; align-items:center; justify-content:center; transition:background 0.3s,transform 0.3s; }
.social-item:hover .social-icon{background:var(--green-dark);transform:scale(1.08)}
.social-icon svg{width:26px;height:26px;fill:#fff}
.social-label { font-family:'Montserrat',sans-serif; font-size:10px; font-weight:600; letter-spacing:2px; color:var(--text-mid); text-transform:uppercase; }

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
.ripple{position:absolute;border-radius:50%;background:rgba(157,196,59,0.22);transform:scale(0);animation:rippleAnim 0.6s ease-out forwards;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>

<!-- BRANCHES: z-index 0, no overflow:hidden, always behind page content -->
<div class="branch branch-tr">
  <img src="branch.svg" alt="">
</div>
<div class="branch branch-bl">
  <img src="branch.svg" alt="">
</div>

<div class="page">

  <!-- LOGO: no clipping container, logo shows fully -->
  <div class="logo-section">
    <img class="logo-img" src="logo.svg" alt="easyMaths logo">
  </div>

  <!-- NAME -->
  <div class="name-section">
    <div class="name-main">Michel H'R</div>
    <div class="name-script">clases de matematica</div>
  </div>

  <!-- DIVIDER -->
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <!-- BUTTONS -->
  <div class="buttons-grid">
    <div class="btn-wrapper"><div class="btn-frame"></div><button class="btn-main" onclick="ripple(event,this)"><span class="btn-corner tl"></span><span class="btn-corner tr"></span><span class="btn-corner bl"></span><span class="btn-corner br"></span><span class="btn-text">Horarios</span></button></div>
    <div class="btn-wrapper"><div class="btn-frame"></div><button class="btn-main" onclick="ripple(event,this)"><span class="btn-corner tl"></span><span class="btn-corner tr"></span><span class="btn-corner bl"></span><span class="btn-corner br"></span><span class="btn-text">Estudiantes</span></button></div>
    <div class="btn-wrapper"><div class="btn-frame"></div><button class="btn-main" onclick="ripple(event,this)"><span class="btn-corner tl"></span><span class="btn-corner tr"></span><span class="btn-corner bl"></span><span class="btn-corner br"></span><span class="btn-text">Cotiza a Domicilio</span></button></div>
    <div class="btn-wrapper"><div class="btn-frame"></div><button class="btn-main" onclick="ripple(event,this)"><span class="btn-corner tl"></span><span class="btn-corner tr"></span><span class="btn-corner bl"></span><span class="btn-corner br"></span><span class="btn-text">Catalogo 2026</span></button></div>
    <div class="btn-wrapper"><div class="btn-frame"></div><button class="btn-main" onclick="ripple(event,this)"><span class="btn-corner tl"></span><span class="btn-corner tr"></span><span class="btn-corner bl"></span><span class="btn-corner br"></span><span class="btn-text">Referencias</span></button></div>

  <!-- SOCIAL -->

      <span class="social-label">Italia</span>
    </a>
  </div>

</div>

<script>
function ripple(e,btn){
  const r=document.createElement('span'); r.className='ripple';
  const rc=btn.getBoundingClientRect(), sz=Math.max(rc.width,rc.height);
  r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rc.left-sz/2)+'px;top:'+(e.clientY-rc.top-sz/2)+'px';
  btn.appendChild(r); setTimeout(()=>r.remove(),600);
}
</script>
</body>
</html>
