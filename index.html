/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:       #85cc00;
  --green-dark:  #6a9e00;
  --green-muted: #9dc43b;
  --cream:       rgba(255,254,250,0.88);
  --border:      rgba(175,170,158,0.50);
  --text-dark:   #2a2a2a;
  --text-mid:    #3a3830;
  --text-soft:   #555;
  --nav-bg:      rgba(248,246,240,0.97);
  --nav-border:  rgba(157,196,59,0.22);
  --nav-h:       64px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Montserrat', sans-serif;
  background: #f5f3ee;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   TOP NAVIGATION BAR
   ============================================================ */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  z-index: 1000;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--nav-border);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: 0 1px 20px rgba(133,204,0,0.08), 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  align-items: center;
  padding: 0 clamp(16px, 4vw, 48px);
  gap: 16px;
}

/* Brand mark in nav */
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.topbar-brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(133,204,0,0.5);
}
.topbar-brand-name {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--text-dark);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* Center spacer */
.topbar-spacer { flex: 1; }

/* Login label (small caps descriptor) */
.topbar-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #999;
  font-weight: 500;
  flex-shrink: 0;
  display: none;
}
@media (min-width: 600px) { .topbar-label { display: block; } }

/* Login buttons group */
.login-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn-login {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--border);
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.22s ease;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.btn-login svg {
  width: 14px; height: 14px;
  flex-shrink: 0;
  opacity: 0.7;
  transition: opacity 0.22s;
}
.btn-login:hover {
  border-color: var(--green);
  color: var(--green-dark);
  background: rgba(133,204,0,0.07);
  box-shadow: 0 2px 10px rgba(133,204,0,0.15);
  transform: translateY(-1px);
}
.btn-login:hover svg { opacity: 1; }

/* Primary login — Admin */
.btn-login.admin {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
  box-shadow: 0 2px 12px rgba(133,204,0,0.28);
}
.btn-login.admin svg { opacity: 1; filter: brightness(10); }
.btn-login.admin:hover {
  background: var(--green-dark);
  border-color: var(--green-dark);
  color: #fff;
  box-shadow: 0 4px 18px rgba(133,204,0,0.38);
}

/* Mobile: hide text, show only icon */
.btn-login .btn-label { display: inline; }
@media (max-width: 480px) {
  .btn-login { padding: 7px 11px; }
  .btn-login .btn-label { display: none; }
  .btn-login svg { width: 16px; height: 16px; }
}

/* Divider between nav buttons */
.topbar-divider {
  width: 1px; height: 24px;
  background: var(--nav-border);
  flex-shrink: 0;
}

/* ============================================================
   MARBLE BACKGROUND — fills full page
   ============================================================ */
.marble-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.marble-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center center;
  display: block;
}

/* ============================================================
   BRANCHES
   ============================================================ */
.branch { position: absolute; pointer-events: none; z-index: 1; }
.branch-tr {
  top: 0; right: 0;
  width: clamp(200px, 28vw, 380px);
  transform-origin: top right;
}
.branch-bl {
  bottom: 0; left: 0;
  width: clamp(200px, 28vw, 380px);
  transform-origin: bottom left;
}
.branch img { width: 100%; height: auto; display: block; }
.branch-bl img { transform: rotate(180deg); }

/* ============================================================
   MAIN PAGE LAYOUT
   ============================================================ */
.page {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  padding-top: calc(var(--nav-h) + clamp(40px, 8vh, 110px));
  padding-bottom: clamp(48px, 8vh, 120px);
  padding-left: clamp(16px, 5vw, 40px);
  padding-right: clamp(16px, 5vw, 40px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ============================================================
   LOGO
   ============================================================ */
.logo-section {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeDown 0.9s ease both;
}
.logo-img {
  width: clamp(220px, 42vw, 520px);
  height: auto;
  display: block;
  filter: drop-shadow(0 6px 26px rgba(100,130,20,0.17));
  animation: logoFloat 2.2s ease-in-out infinite;
}
@keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

/* ============================================================
   NAME SECTION
   ============================================================ */
.name-section {
  margin-top: clamp(28px, 5vh, 80px);
  text-align: center;
  animation: fadeUp 0.9s 0.25s ease both;
}
.name-main {
  font-family: 'Playfair Display', serif;
  font-size: clamp(64px, 13vw, 160px);
  font-weight: 400;
  color: var(--text-dark);
  letter-spacing: -1px;
  line-height: 0.95;
}
.name-script {
  font-family: 'Jonathan', cursive;
  font-size: clamp(52px, 11vw, 132px);
  font-weight: 400;
  color: var(--green);
  line-height: 1.05;
  margin-top: -6px;
  animation: fadeUp 0.9s 0.35s ease both;
}

/* ============================================================
   DIVIDER
   ============================================================ */
.divider {
  width: clamp(160px, 20vw, 240px);
  margin: clamp(20px, 3vh, 36px) 0;
  display: flex;
  align-items: center;
  gap: 14px;
  animation: fadeUp 0.9s 0.4s ease both;
}
.divider-line { flex: 1; height: 1px; background: #bfbcb7; }
.divider-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green-muted);
  box-shadow: 0 0 10px rgba(157,196,59,0.4);
}

/* ============================================================
   BUTTONS GRID
   ============================================================ */
.buttons-grid {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 2.5vh, 28px);
}

.btn-wrapper {
  position: relative;
  transition: transform 0.3s ease, filter 0.3s ease;
}
.btn-wrapper:hover  { transform: translateY(-4px); filter: drop-shadow(0 8px 20px rgba(133,204,0,0.18)); }
.btn-wrapper:active { transform: scale(0.98); }

.btn-main {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 40px);
  background: var(--cream);
  border: 1.8px solid var(--border);
  border-radius: 18px 28px 18px 28px;
  cursor: pointer;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(10px);
  box-shadow:
    0 2px 0 rgba(255,255,255,0.9),
    0 4px 18px rgba(0,0,0,0.06),
    inset 0 1px 2px rgba(255,255,255,0.85);
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, border-radius 0.4s;
  overflow: hidden;
}
.btn-main::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 50%, rgba(133,204,0,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 80% 50%, rgba(133,204,0,0.04) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.4s ease;
  border-radius: inherit;
}
.btn-wrapper:hover .btn-main::before { opacity: 1; }
.btn-main::after {
  content: '';
  position: absolute; left: -120%; top: 0;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}
.btn-wrapper:hover .btn-main::after { left: 140%; }
.btn-wrapper:hover .btn-main {
  background: rgba(255,255,252,0.94);
  border-color: rgba(133,204,0,0.35);
  border-radius: 28px 18px 28px 18px;
  box-shadow:
    0 2px 0 rgba(255,255,255,0.95),
    0 8px 28px rgba(133,204,0,0.12),
    inset 0 1px 3px rgba(255,255,255,0.9);
}
.btn-text {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(13px, 2.2vw, 22px);
  font-weight: 500;
  letter-spacing: clamp(3px, 0.8vw, 6px);
  color: var(--text-mid);
  text-transform: uppercase;
  position: relative; z-index: 1;
}

/* Leaf corners */
.btn-leaf {
  position: absolute; width: 18px; height: 18px;
  opacity: 0.30; transition: opacity 0.3s;
  pointer-events: none; z-index: 2;
}
.btn-wrapper:hover .btn-leaf { opacity: 0.65; }
.btn-leaf.tl { top: 7px; left: 12px; }
.btn-leaf.tr { top: 7px; right: 12px; transform: scaleX(-1); }
.btn-leaf.bl { bottom: 7px; left: 12px; transform: scaleY(-1); }
.btn-leaf.br { bottom: 7px; right: 12px; transform: scale(-1); }

/* Staggered entrance */
.btn-wrapper:nth-child(1) { animation: fadeUp 0.55s 0.55s ease both; }
.btn-wrapper:nth-child(2) { animation: fadeUp 0.55s 0.65s ease both; }
.btn-wrapper:nth-child(3) { animation: fadeUp 0.55s 0.75s ease both; }
.btn-wrapper:nth-child(4) { animation: fadeUp 0.55s 0.85s ease both; }
.btn-wrapper:nth-child(5) { animation: fadeUp 0.55s 0.95s ease both; }

/* ============================================================
   SOCIAL ROW
   ============================================================ */
.social-row {
  margin-top: clamp(40px, 7vh, 120px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: clamp(28px, 5vw, 80px);
  flex-wrap: wrap;
  animation: fadeUp 0.9s 1.0s ease both;
}
.social-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  cursor: pointer; text-decoration: none;
  transition: transform 0.25s;
}
.social-item:hover { transform: translateY(-8px); }
.social-icon {
  width: clamp(64px, 10vw, 96px);
  height: clamp(64px, 10vw, 96px);
  border-radius: 50%;
  background: #2e2e2e;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.25s, transform 0.25s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.social-item:hover .social-icon { background: #6a7c2a; transform: scale(1.08); }
.social-icon svg {
  width: clamp(30px, 4.5vw, 50px);
  height: clamp(30px, 4.5vw, 50px);
  fill: #fff;
}
.social-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(10px, 1.5vw, 17px);
  font-weight: 600;
  letter-spacing: 2.5px;
  color: var(--text-soft);
  text-transform: uppercase;
}

/* ============================================================
   MODAL (login panel)
   ============================================================ */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  z-index: 9000;
  background: rgba(30,28,22,0.55);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.open { display: flex; }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.modal-box {
  background: rgba(252,250,244,0.98);
  border-radius: 20px 28px 20px 28px;
  border: 1.5px solid var(--border);
  box-shadow: 0 24px 64px rgba(0,0,0,0.18), 0 4px 16px rgba(133,204,0,0.12);
  width: min(92vw, 380px);

  animation: slideUp 0.28s ease both;
}
@keyframes slideUp { from{transform:translateY(24px);opacity:0} to{transform:none;opacity:1} }

.modal-close {

  font-size: 20px; color: #aaa; cursor: pointer;
  line-height: 1; padding: 4px 8px;

}
.modal-close:hover { color: var(--text-dark); background: rgba(0,0,0,0.06); }

.modal-role-badge {

}
.modal-role-badge svg { width: 12px; height: 12px; }

.modal-title {
  font-family: 'Playfair Display', serif;

  line-height: 1.2;
}
.modal-subtitle {
  font-size: 12px; color: #888;
  letter-spacing: 0.5px;
  margin-bottom: 28px;
}

.modal-field { margin-bottom: 16px; }
.modal-field label {
  display: block;
  font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: #888; margin-bottom: 7px;
}
.modal-field input {
  width: 100%;
  padding: 11px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.8);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px; color: var(--text-dark);

}
.modal-field input:focus {
  border-color: var(--green-muted);

}

.modal-forgot {
  text-align: right; margin-top: -8px; margin-bottom: 20px;
}
.modal-forgot a {
  font-size: 11px; color: #aaa;
  text-decoration: none; letter-spacing: 0.3px;
  transition: color 0.2s;
}
.modal-forgot a:hover { color: var(--green-dark); }

.modal-submit {
  width: 100%;
  padding: 13px;
  border-radius: 14px 20px 14px 20px;
  border: none;
  background: var(--green);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(133,204,0,0.3);
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}
.modal-submit:hover {
  background: var(--green-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(133,204,0,0.38);
}
.modal-submit:active { transform: scale(0.98); }

.modal-roles-switch {
  margin-top: 22px;
  display: flex; gap: 8px; justify-content: center;
  flex-wrap: wrap;
}
.role-chip {
  padding: 5px 14px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: #999; cursor: pointer;

}
.role-chip:hover, .role-chip.active {
  border-color: var(--green);
  color: var(--green-dark);
  background: rgba(133,204,0,0.08);

/* ============================================================
   KEYFRAMES UTILITIES
   ============================================================ */
@keyframes fadeUp   { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-24px)} to{opacity:1;transform:none} }

.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(133,204,0,0.18); transform: scale(0);

  .topbar-divider { display: none; }

}

<script>
/* ---- Ripple ---- */
function ripple(e, btn) {
  const r = document.createElement('span'); r.className = 'ripple';
  const rc = btn.getBoundingClientRect(), sz = Math.max(rc.width, rc.height);
  r.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rc.left-sz/2)+'px;top:'+(e.clientY-rc.top-sz/2)+'px';
  btn.appendChild(r); setTimeout(() => r.remove(), 600);
}

/* ---- Login Modal ---- */
const roleConfig = {
  admin:      { label: 'Administrador', title: 'Panel de Administración', sub: 'Acceso exclusivo para administradores', icon: 'shield' },
  estudiante: { label: 'Estudiante',     title: 'Mi Portal de Clases',      sub: 'Ingresa para ver tus horarios y materiales', icon: 'student' },
  cliente:    { label: 'Cliente',        title: 'Portal de Clientes',       sub: 'Gestiona tus cotizaciones y reservas', icon: 'people' }
};
const icons = {
  shield:  '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l4 1.82V11c0 3.38-2.34 6.53-4 7.44C10.34 17.53 8 14.38 8 11V6.82L12 5z"/>',
  student: '<path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>',
  people:  '<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>' 
};

function openModal(role) {
  const cfg = roleConfig[role];
  document.getElementById('modalRoleLabel').textContent = cfg.label;
  document.getElementById('modalTitle').textContent = cfg.title;
  document.getElementById('modalSubtitle').textContent = cfg.sub;
  document.getElementById('modalBadgeIcon').innerHTML = icons[cfg.icon];
  document.getElementById('modalEmail').value = '';
  document.getElementById('modalPass').value = '';
  // Update chips
  document.querySelectorAll('.role-chip').forEach(c => c.classList.toggle('active', c.dataset.role === role));
  document.getElementById('loginModal').classList.add('open');
  setTimeout(() => document.getElementById('modalEmail').focus(), 100);
}

function closeModal() { document.getElementById('loginModal').classList.remove('open'); }

function closeModalOutside(e) {
  if (e.target === document.getElementById('loginModal')) closeModal();
}

function switchRole(chip) {
  const role = chip.dataset.role;
  const cfg = roleConfig[role];
  document.getElementById('modalRoleLabel').textContent = cfg.label;
  document.getElementById('modalTitle').textContent = cfg.title;
  document.getElementById('modalSubtitle').textContent = cfg.sub;
  document.getElementById('modalBadgeIcon').innerHTML = icons[cfg.icon];
  document.querySelectorAll('.role-chip').forEach(c => c.classList.toggle('active', c === chip));
}

function handleLogin() {
  const email = document.getElementById('modalEmail').value;
  const pass  = document.getElementById('modalPass').value;
  if (!email || !pass) {
    document.getElementById('modalEmail').style.borderColor = '#e07070';
    document.getElementById('modalPass').style.borderColor = '#e07070';
    setTimeout(() => {
      document.getElementById('modalEmail').style.borderColor = '';
      document.getElementById('modalPass').style.borderColor = '';
    }, 1500);
    return;
  }
  const btn = document.querySelector('.modal-submit');
  btn.textContent = 'Verificando...';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = 'Iniciar sesión';
    btn.disabled = false;
  }, 1500);
}

// ESC closes modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
